<text class="h" x="600" y="110">Battery meter wiring</text>
<text class="s" x="600" y="170">1. Join two 100k resistors end to end.</text>
<text class="s" x="600" y="208">2. Blue: IO35 pin to the joint between them.</text>
<text class="s" x="600" y="246">3. Black: GND pin to the free end of the top one.</text>
<text class="s" x="600" y="284">4. Red: free end of the bottom one to the TP4056 B+ pad.</text>
<text class="s" x="600" y="322">5. Tape the red and yellow P3 wires (IO21, IO22).</text>
<text class="n" x="600" y="366">P3 left to right: red IO21, yellow IO22, blue IO35, black GND.</text>
<text class="n" x="600" y="396">P5 left to right: GND, RX, TX, VIN. Black = GND, red = VIN.</text>
<text class="h" x="600" y="460" style="font-size:24px">Legend</text>
