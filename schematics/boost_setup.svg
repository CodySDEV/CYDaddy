<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="DejaVu Sans, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect width="1280" height="720" fill="#ffffff"/>
<text x="40" y="52" font-size="32" font-weight="700" fill="#222">Step 1: set the boost to 5.0 V BEFORE it touches the CYD</text>
<text x="40" y="92" font-size="22" fill="#a33">Skipping this killed a CYD (the boost came set to 21.5 V). Output wires stay OFF the board.</text>
<!-- bench supply -->
<rect x="60" y="170" width="300" height="220" rx="14" fill="#34495e"/>
<rect x="85" y="195" width="250" height="80" rx="8" fill="#111"/>
<text x="210" y="248" font-size="48" font-weight="700" fill="#4cff7a" text-anchor="middle" font-family="DejaVu Sans Mono">3.70 V</text>
<text x="210" y="300" font-size="22" fill="#fff" text-anchor="middle">bench supply</text>
<text x="210" y="332" font-size="20" fill="#f1c40f" text-anchor="middle">current limit 0.3 A</text>
<circle cx="130" cy="372" r="11" fill="#d6322b"/><circle cx="290" cy="372" r="11" fill="#111"/>
<text x="112" y="410" font-size="20" fill="#222" text-anchor="middle">+</text><text x="272" y="410" font-size="20" fill="#222" text-anchor="middle">-</text>
<!-- boost -->
<rect x="560" y="200" width="320" height="170" rx="10" fill="#2d6fbf"/>
<rect x="710" y="225" width="80" height="62" rx="6" fill="#c9a24a"/>
<circle cx="750" cy="256" r="14" fill="#8a6a1c"/><line x1="738" y1="256" x2="762" y2="256" stroke="#222" stroke-width="3"/>
<text x="750" y="312" font-size="20" fill="#fff" text-anchor="middle">trim pot</text>

<text x="640" y="190" font-size="24" font-weight="700" fill="#222" text-anchor="middle">MT3608 boost</text>
<g fill="#d4af37"><circle cx="590" cy="355" r="9"/><circle cx="650" cy="355" r="9"/><circle cx="800" cy="355" r="9"/><circle cx="860" cy="355" r="9"/></g>
<text x="590" y="338" font-size="19" fill="#222" text-anchor="middle">IN-</text><text x="650" y="338" font-size="19" fill="#222" text-anchor="middle">IN+</text>
<text x="800" y="338" font-size="19" fill="#222" text-anchor="middle">OUT-</text><text x="860" y="338" font-size="19" fill="#222" text-anchor="middle">OUT+</text>
<!-- supply wires -->
<path d="M130 372 V470 H650 V355" stroke="#d6322b" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M290 372 V520 H590 V355" stroke="#222" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="300" y="462" font-size="20" fill="#d6322b">3.7 V in (like a battery)</text>
<!-- multimeter -->
<rect x="940" y="180" width="280" height="330" rx="22" fill="#f4c20d"/>
<rect x="965" y="205" width="230" height="90" rx="8" fill="#cfe6cf"/>
<text x="1080" y="270" font-size="52" font-weight="700" fill="#222" text-anchor="middle" font-family="DejaVu Sans Mono">5.0 V</text>
<circle cx="1080" cy="395" r="48" fill="#333"/><text x="1080" y="402" font-size="20" fill="#fff" text-anchor="middle">DC V</text>
<text x="1080" y="478" font-size="20" fill="#222" text-anchor="middle">meter on DC volts</text>
<path d="M1010 510 V600 H860 V355" stroke="#d6322b" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1150 510 V640 H800 V355" stroke="#222" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="40" y="615" font-size="21" fill="#222">Meter: red probe to OUT+, black probe to OUT-</text>
<text x="40" y="676" font-size="22" fill="#222">Turn the trim pot with a small screwdriver. Check it holds 5.0 V (5.1 is fine)</text>
<text x="40" y="706" font-size="22" fill="#222">with the supply at 3.0 V and at 4.2 V. Only then wire OUT+ to CYD VIN and OUT- to GND on P5.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
