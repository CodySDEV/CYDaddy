<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="DejaVu Sans, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect width="1280" height="720" fill="#fff"/>
<text x="40" y="52" font-size="30" font-weight="700" fill="#222">CYD connectors we use (go by the silkscreen, not the wire colours)</text>
<text x="40" y="112" font-size="26" font-weight="700" fill="#222">P5  power in (next to the USB-C)</text>
<g font-size="26" font-weight="700" fill="#222" text-anchor="middle"><text x="112" y="164">GND</text><text x="197" y="164">RX</text><text x="282" y="164">TX</text><text x="367" y="164">VIN</text></g>
<rect x="60" y="178" width="340" height="70" rx="6" fill="#f1efe8" stroke="#555" stroke-width="2"/>
<g fill="#444"><rect x="95" y="196" width="34" height="34" rx="4"/><rect x="180" y="196" width="34" height="34" rx="4"/><rect x="265" y="196" width="34" height="34" rx="4"/><rect x="350" y="196" width="34" height="34" rx="4"/></g>
<path d="M112 230 V330" stroke="#222" stroke-width="8" stroke-linecap="round"/><path d="M367 230 V330" stroke="#d6322b" stroke-width="8" stroke-linecap="round"/>
<text x="112" y="368" font-size="22" fill="#222" text-anchor="middle">to boost OUT-</text><text x="367" y="368" font-size="22" fill="#d6322b" text-anchor="middle">to boost OUT+</text>
<text x="240" y="288" font-size="20" fill="#666" text-anchor="middle">RX, TX unused</text>
<text x="660" y="112" font-size="26" font-weight="700" fill="#222">P3  4-pin (battery meter)</text>
<g font-size="26" font-weight="700" fill="#222" text-anchor="middle"><text x="732" y="164">IO21</text><text x="817" y="164">IO22</text><text x="902" y="164">IO35</text><text x="987" y="164">GND</text></g>
<rect x="680" y="178" width="340" height="70" rx="6" fill="#f1efe8" stroke="#555" stroke-width="2"/>
<g fill="#444"><rect x="715" y="196" width="34" height="34" rx="4"/><rect x="800" y="196" width="34" height="34" rx="4"/><rect x="885" y="196" width="34" height="34" rx="4"/><rect x="970" y="196" width="34" height="34" rx="4"/></g>
<path d="M732 230 V300" stroke="#d6322b" stroke-width="8" stroke-linecap="round"/><path d="M817 230 V300" stroke="#f1c40f" stroke-width="8" stroke-linecap="round"/>
<circle cx="732" cy="306" r="9" fill="#222"/><circle cx="817" cy="306" r="9" fill="#222"/>
<path d="M902 230 V330" stroke="#2d8cf0" stroke-width="8" stroke-linecap="round"/><path d="M987 230 V330" stroke="#222" stroke-width="8" stroke-linecap="round"/>
<text x="775" y="350" font-size="21" fill="#666" text-anchor="middle">red + yellow:</text><text x="775" y="376" font-size="21" fill="#666" text-anchor="middle">taped, unused</text>
<text x="902" y="368" font-size="21" fill="#2d8cf0" text-anchor="middle">blue:</text><text x="902" y="394" font-size="21" fill="#2d8cf0" text-anchor="middle">resistor joint</text>
<text x="1000" y="426" font-size="21" fill="#222" text-anchor="middle">black: resistor chain end</text>
<text x="40" y="470" font-size="26" font-weight="700" fill="#222">SPEAK  speaker (JST-PH 1.25 mm, 2 pins)</text>
<rect x="60" y="494" width="130" height="70" rx="6" fill="#f1efe8" stroke="#555" stroke-width="2"/>
<g fill="#444"><rect x="90" y="512" width="34" height="34" rx="4"/><rect x="130" y="512" width="34" height="34" rx="4"/></g>
<text x="215" y="528" font-size="23" fill="#222">Plug the speaker's own JST plug straight in. No soldering.</text><text x="215" y="558" font-size="23" fill="#222">Either way round works for a speaker.</text>
<text x="40" y="640" font-size="21" fill="#222">Pin order is printed on the board. The wire colours are what our P3 cable happened to have.</text>
<text x="40" y="674" font-size="21" fill="#222">The 100k resistor chain (IO35, GND, battery +) is drawn in the full wiring picture.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>